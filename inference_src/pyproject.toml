[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "reranker_prompt"
version = "0.1.0"
description = "Shared Rust/Python prompt formatter for MovieLens Qwen reranker"
authors = [
    { name = "Nichole King" },
]
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.24"]
# Ensure inference_src/README.txt exists, or remove this line
readme = "README.txt"
license = { text = "MIT" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://www.kaggle.com/code/nicholeasuniquename/ranker-cross-encoder-w-gatv2/"
Repository = "https://github.com/nking/ranker.git"

[tool.maturin]
manifest-path = "reranker_prompt/Cargo.toml"
module-name = "reranker_prompt"
features = ["python"]
compatibility = "manylinux_2_39"
zig = true
strip = true